<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="mymobilepagestyle.css" rel="stylesheet" type="text/css" media="all">

<body>
<header class="header1"><b><i>Autumns Skyview Lookout</i></b></header>
<div class="dropdown">
  <button onclick="myFunction()" class="dropbtn"><hr><hr><hr></button></div>
<div id="myDropdown" class="dropdown-content"><hr class="hr2" style="margin-top:1%;">
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index4'">Home</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index5'">About</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index6'"
>Contact</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index8'">My Posts</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index7'">My Photography</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index9'">Guestbook</button>
<button onclick="document.getElementById('Pages').src='/autumns-skyview-lookout/index10'">Links</button>
<button onclick="document.getElementById('Pages').src='https://autumn-embers.github.io/autumns-linux-guides/'">My Linux Guide</button>
<script>
function myFunction() {
    document.getElementById("myDropdown").classList.toggle("show");
}

// Close the dropdown menu if the user clicks outside of it
window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        var i;
        for (i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}
</script>
<hr class="hr1"></div>
<iframe class="iframe1" id="Pages" src='/index4'></iframe>
</body>
</html>
