<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autumns-skyview-lookout Mobile</title>
<link href="mymobilepagestyle.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
<header class="header1"><b><i>Autumns Skyview Lookout</i></b></header>
<div class="dropdown">
<button onclick="myFunction()" class="dropbtn"><hr><hr><hr></button></div>
<div id="myDropdown" class="dropdown-content"><hr class="hr2" style="margin-top:1%;">
<button class="button1" onclick="document.getElementById('Pages').src='/index4'">Home</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index5'">About</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index6'"
>Contact</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index8'">My Posts</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index7'">My Photography</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index9'">Guestbook</button>
<button class="button1" onclick="document.getElementById('Pages').src='/index10'">Links</button>
<button class="button1" onclick="document.getElementById('Pages').src='https://autumn-embers.github.io/autumns-linux-guides/'">My Linux Guide</button>
<hr class="hr1">
<button Id="dtb" class="dt">Date & Time Will Display Here</button>
<br><br>
<hr class="hr2" style="margin-top:-1%;">
</div>
<iframe class="iframe1" id="Pages" src='/index4'></iframe>
<script>
function myFunction() {
    document.getElementById("myDropdown").classList.toggle("show");
}
window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        var i;
        for (i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}
var dtbElement = document.getElementById('dtb');


function dtb() {
        dtbElement.textContent = new Date().toString();
    }
    
    setInterval(dtb, 1000);
</script>
</body>
</html>
